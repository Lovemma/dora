nodes:
  # MaaS Client with MCP support
  - id: maas-client
    build: cargo build -p dora-maas-client --release
    path: ../../target/release/dora-maas-client
    inputs:
      text: chat-client/text
    outputs:
      - text
      - status
      - log
    env:
      MAAS_CONFIG_PATH: /Users/yuechen/home/fresh/dora/examples/alicloud-maas/mcp_test_config.toml
      LOG_LEVEL: INFO
      RUST_LOG: info

  # Interactive chat client (dynamic node)
  - id: chat-client
    path: dynamic
    outputs:
      - text
    inputs:
      text: maas-client/text
      status: maas-client/status
      log: maas-client/log