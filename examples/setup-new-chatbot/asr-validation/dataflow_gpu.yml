# GPU-enabled ASR dataflow for testing
nodes:
  # WAV file player - reads test audio and sends it
  - id: wav-player
    custom:
      source: python
      args: wav_player_node.py
    outputs:
      - audio
      
  # ASR node with GPU acceleration
  - id: asr
    operator:
      python: ../../../node-hub/dora-asr
    inputs:
      audio: wav-player/audio
    outputs:
      - text
    env:
      USE_GPU: "true"
      ASR_ENGINE: "funasr"
      LANGUAGE: "zh"
      ASR_MODELS_DIR: "/home/user/.dora/models/asr"
      ENABLE_PUNCTUATION: "true"
      LOG_LEVEL: "INFO"
      
  # Result logger - displays transcription
  - id: result-logger
    custom:
      source: python
      args: result_logger_node.py
    inputs:
      text: asr/text